name: Publish NuGet Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to NuGet.org (set to false to do a dry run)'
        required: true
        default: true
        type: boolean
      nuget_username:
        description: 'NuGet.org Username (Profile Name) to login'
        required: false
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack NuGet Package
      run: dotnet pack CountryPicker.Blazor/CountryPicker.Blazor.csproj --configuration Release --no-build --output ./nupkg

    - name: NuGet Login
      if: |
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ inputs.nuget_username || github.repository_owner }}

    - name: Publish to NuGet.org
      if: |
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true)
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source "https://api.nuget.org/v3/index.json" \
          --skip-duplicate
